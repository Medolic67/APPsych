let AQ=[],ai=0,as=0,asec="all";
const SECS=["all","2.3","2.4","2.5","2.6","2.7","2.8"];
function app(){AQ=sh(APP.filter(x=>asec=="all"||x[4]==asec)).slice(0,12);ai=0;as=0;appQ()}
function appQ(){
  const head=`<div class="card"><div class="mu">Most of these come straight from your 2.3–2.8 study guide, with the term bank turned into multiple choice. Pick a section, or mix them all.</div><div class="chips row">${SECS.map(s=>`<button class="${s==asec?"on":""}" onclick="asec='${s}';app()">${s=="all"?"All sections":s}</button>`).join("")}</div></div>`;
  if(ai>=AQ.length){$("main").innerHTML=head+`<div class="card"><h2>Scenarios complete</h2><p>Score: <b>${as}</b> / ${AQ.length}</p><button class="on" onclick="app()">New set of ${AQ.length}</button></div>`;return}
  const [s,a,ds,w,sec]=AQ[ai],o=sh([a,...ds]);
  $("main").innerHTML=head+`<div class="mu">Scenario ${ai+1} of ${AQ.length} · Score ${as}</div><div class="pg"><i style="width:${ai/AQ.length*100}%"></i></div><div class="card" style="font-size:17px"><span class="tag">${sec}</span><div style="margin-top:8px">${s}</div></div><div>${o.map(x=>`<button class="opt" onclick="appP(this,${x==a})">${x}</button>`).join("")}</div><div id="f"></div>`;
}
function appP(b,ok){
  const [s,a,ds,w]=AQ[ai];document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent==a)x.classList.add("ok")});
  if(ok)as++;else{b.classList.add("bad");const k=D.findIndex(d=>d[0]==a);if(k>=0){addMiss(k);bar()}}
  $("f").innerHTML=`<div class="card"><b>${a}.</b> ${w}</div><button class="on" onclick="ai++;appQ()">Next</button>`;
}

/* ---------- AAQ ---------- */
const AAQS=[
{t:"Study 1: Cramming vs. Spacing",s:"A researcher tested whether spreading out study time improves long-term memory. Ninety 10th-grade students from three Spanish classes at one suburban high school took part, with parental consent and student assent. Students were randomly assigned to study 50 new Spanish vocabulary words either in one 90-minute session (massed group) or in three 30-minute sessions spread over one week (distributed group). Three weeks after their final session, all students took the same 50-item fill-in-the-blank vocabulary test. The massed group averaged 22 correct (SD = 8); the distributed group averaged 34 correct (SD = 6). The difference was statistically significant (p < .01).",
p:[["Identify the research method used in the study.","An <b>experiment</b>. The researcher manipulated the study schedule and used <b>random assignment</b>."],
["State the operational definition of long-term memory in the study.","The <b>number of the 50 vocabulary words correctly recalled</b> on the fill-in-the-blank test three weeks after the final study session."],
["Describe the meaning of the difference in standard deviations.","The massed group's scores (SD = 8) were <b>more spread out</b> around their mean than the distributed group's (SD = 6), so cramming produced less consistent results."],
["Identify at least one ethical guideline applied by the researcher.","<b>Informed consent</b>: parental consent plus student assent for minors."],
["Explain the extent to which the research findings may or may not be generalizable.","Limited: all participants were 10th graders from <b>one suburban school</b>, so results may not generalize to other ages, schools, or subjects. Random assignment supports a causal conclusion <i>within</i> this sample, but the sample isn't randomly selected."],
["Explain how at least one of the research findings supports or refutes the hypothesis that distributed practice improves long-term memory.","It <b>supports</b> it: the distributed group recalled significantly more words (34 vs. 22, p &lt; .01), which demonstrates the <b>spacing effect</b> (2.4). The fill-in-the-blank format also means it measured <b>recall</b>, not recognition."]]},
{t:"Study 2: Leading Questions and False Memories",s:"Inspired by Loftus and Palmer, a psychologist recruited 150 undergraduates from an introductory psychology course. Each watched the same 30-second video of a minor two-car accident with no broken glass. Participants were randomly assigned to one of three groups: one was asked, “How fast were the cars going when they smashed into each other?”, one was asked the same question with the word “hit,” and a control group was not asked about speed. One week later, all participants were asked, “Did you see any broken glass?” Results: 34% of the smashed group, 15% of the hit group, and 12% of the control group said yes. Participants were debriefed about the purpose of the study at the end.",
p:[["Identify the independent variable.","The <b>wording of the question</b> after the video: \"smashed,\" \"hit,\" or no speed question (control)."],
["Identify the dependent variable.","Whether participants <b>reported seeing broken glass</b> one week later (the percentage answering yes)."],
["Identify the memory phenomenon demonstrated and explain how the results show it.","The <b>misinformation effect</b>: the misleading word \"smashed\" changed participants' memory. More than twice as many in the smashed group (34%) falsely remembered glass compared with the hit (15%) and control (12%) groups. It also shows that memory is <b>constructive</b>."],
["Explain why the researcher included a control group.","It provides a <b>baseline</b>: 12% falsely remembered glass with no leading question at all. That lets the researcher show that the word \"smashed\" increased false memories beyond normal error."],
["Identify one ethical guideline used and explain why it was necessary.","<b>Debriefing</b>. Because participants were misled about the study's purpose (and their memories were altered), they needed to be told the truth afterward."],
["Explain one limitation on generalizability.","Undergraduates from one intro course watching a video may not represent <b>real eyewitnesses</b>, who see live events under stress and face real stakes."]]},
{t:"Study 3: Does a New Aptitude Test Work?",s:"A school district developed a new math aptitude test. To evaluate it, district psychologists gave the test to 400 eighth graders from all five of the district's middle schools. Two weeks later, the same students took the test again; the correlation between the two sets of scores was r = +0.88. At the end of the following year, the psychologists correlated the students' original scores with their 9th-grade math grades and found r = +0.45. All test administrators followed the same written script and time limits, and families could opt out of the study.",
p:[["Identify the research method used to evaluate whether the test predicts 9th-grade grades.","<b>Correlational research</b>: no variable was manipulated; the psychologists measured the relationship between test scores and later grades."],
["Identify the type of reliability measured and explain what r = +0.88 shows.","<b>Test-retest reliability</b>. A strong positive correlation means students scored very <b>consistently</b> across the two sittings, so the test is reliable."],
["Identify the type of validity measured by the second correlation.","<b>Predictive validity</b>: whether test scores predict a future criterion (9th-grade math grades)."],
["Explain why the researchers cannot conclude that a high test score causes better grades.","Correlation does not show <b>causation</b>. A third variable, such as prior math knowledge, motivation, or study habits, could influence both scores and grades."],
["Identify the psychometric principle shown by the script and time limits.","<b>Standardization</b>: uniform procedures for every test-taker so scores can be compared fairly against norms."],
["Explain whether this test is better described as an aptitude test or an achievement test.","An <b>aptitude test</b>: its purpose is to <b>predict</b> future math performance, not to measure what was already learned. Its moderate predictive validity (r = +0.45) means it predicts grades only partly."]]}
];

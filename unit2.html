<script>
function switchUnit(v){window.location.href=(v==="index"?"index":v)+".html"}

const KEY="nm_unit2_missed";
const C={
  Z:"1.5 Sleep & Consciousness",
  B:"1.6 Sensation Basics",
  V:"1.6 Vision",
  H:"1.6 Hearing",
  O:"1.6 Smell & Taste",
  T:"1.6 Touch, Pain & Body Position",
  P:"2.1 Perception & Attention",
  Q:"2.1 Visual Perception",
  R:"2.2 Concepts & Thinking",
  J:"2.2 Problem-Solving & Judgment"
};

/* [term, category, definition, 1 = beyond the slides] */
const D=[
["Consciousness","Z","Our awareness of ourselves and our environment. It shifts across the day and night, which affects focus and performance."],
["Altered state of consciousness","Z","Any state that differs noticeably from normal waking awareness, such as sleep, dreaming, hypnosis, meditation, psychoactive drugs, daydreaming, or coma."],
["Circadian rhythm","Z","The roughly 24-hour biological clock that regulates sleep, wakefulness, body temperature, and hormone release."],
["Suprachiasmatic nucleus (SCN)","Z","A cluster of neurons in the hypothalamus that responds to light from the retina and resets the circadian rhythm. In the morning it signals the pineal gland to cut melatonin."],
["Jet lag","Z","Fatigue, low mood, and poor alertness caused by a body clock that is out of sync with local time after crossing time zones."],
["EEG patterns","Z","Brain-wave recordings from an electroencephalogram. Researchers use them to identify which stage of sleep a person is in."],
["Beta waves","Z","Fast, low-amplitude brain waves of an alert, awake, thinking brain. REM sleep looks similar.",1],
["Alpha waves","Z","Relatively slow brain waves of a relaxed, awake state, such as resting with your eyes closed just before falling asleep."],
["Theta waves","Z","Irregular, slower brain waves typical of NREM-1, the light, transitional sleep.",1],
["NREM sleep","Z","Non-rapid eye movement sleep. Stages 1 through 3 are progressively deeper. The slides use the older Stage 3/Stage 4 split, which is now combined into NREM-3."],
["NREM-1","Z","Light, brief transitional sleep that is easy to wake from. Hypnagogic sensations, such as falling or hearing sounds, happen here."],
["NREM-2","Z","Deeper relaxation marked by sleep spindles and K-complexes. Adults spend about half the night in this stage."],
["Sleep spindles","Z","Bursts of rapid, rhythmic brain-wave activity that mark NREM-2 sleep."],
["NREM-3 (deep sleep)","Z","Slow-wave sleep with large, slow delta waves. It is the hardest stage to wake from and is key for physical restoration and growth hormone release. Sleepwalking happens here."],
["Delta waves","Z","Large, slow brain waves associated with deep NREM-3 sleep."],
["REM sleep","Z","Rapid eye movement sleep, also called paradoxical sleep: the brain is highly active but the voluntary muscles are paralyzed. Vivid dreams happen here, and it supports memory consolidation."],
["REM rebound","Z","The increase in REM sleep after a person has been deprived of it, for example after sleep loss, stress, or alcohol and drug use that suppress REM."],
["Hypnagogic sensations","Z","Bizarre experiences while falling asleep (NREM-1), such as a falling sensation, a body jerk, or hearing your name. They are common, and more frequent with sleep disorders."],
["Hallucinations","Z","False sensory experiences, such as seeing or hearing something with no external stimulus. Examples include hypnagogic hallucinations, hallucinations in narcolepsy, and drug-induced hallucinations."],
["Dreams","Z","Sequences of images, emotions, and thoughts that pass through a sleeping mind. The most vivid ones occur in REM."],
["Activation-synthesis theory","Z","Biological dream theory: random neural firing during REM (from the brainstem) is woven together by the cortex into a story. Dreams are the brain making sense of noise."],
["Consolidation theory","Z","Biological dream theory: sleep and dreams help process, sort, and solidify the day's memories and experiences."],
["Memory consolidation","Z","The neural storage of a long-term memory. Sleep, both REM and deep NREM, strengthens it, so pulling all-nighters hurts learning."],
["Insomnia","Z","Recurring difficulty falling or staying asleep, leading to daytime fatigue and impaired functioning."],
["Narcolepsy","Z","Sudden, uncontrollable sleep attacks, often directly into REM, sometimes with cataplexy (sudden loss of muscle tone). It is linked to a lack of hypocretin (orexin) from the hypothalamus."],
["Sleep apnea","Z","Breathing repeatedly stops during sleep, causing brief awakenings and excessive daytime sleepiness. It is often accompanied by loud snoring."],
["Somnambulism (sleepwalking)","Z","Walking or doing tasks while still asleep. It happens in deep NREM-3 sleep and is more common in children."],
["Night terrors","Z","High arousal and an appearance of terror (screaming, racing heart) during NREM-3, seldom remembered. Mostly seen in children. Not the same as nightmares, which happen in REM.",1],
["REM sleep behavior disorder","Z","The normal REM muscle paralysis is missing, so people physically act out their dreams. It is seen mostly in older men."],
["Sleep deprivation","Z","Not getting enough sleep. It impairs attention, memory, mood, and immunity, raises accident risk, and shifts hunger hormones (more ghrelin, less leptin).",1],

["Sensation","B","The process by which our sensory receptors and nervous system receive and represent stimulus energies from the environment."],
["Transduction","B","Converting one form of energy into another. In sensation, stimulus energy such as light, sound waves, or chemicals is converted into neural impulses."],
["Absolute threshold","B","The minimum intensity of a stimulus that a person can detect 50% of the time."],
["Signal detection theory","B","Explains how we detect faint stimuli amid background noise. Detection depends on experience, expectations, motivation, and fatigue, not just stimulus strength (hits, misses, false alarms).",1],
["Subliminal","B","Below a person's absolute threshold for conscious awareness.",1],
["Difference threshold (JND)","B","The just-noticeable difference: the smallest change between two stimuli that a person can detect 50% of the time."],
["Weber's law","B","The just-noticeable difference is a constant proportion of the original stimulus, not a constant amount. A teaspoon of sugar is noticeable in unsweet tea but not in very sweet tea."],
["Sensory adaptation","B","Decreased sensitivity after constant exposure to an unchanging stimulus, such as no longer noticing a ticking clock or your clothes."],
["Sensory interaction","B","One sense influences another. For example, smell strongly affects taste."],
["Synesthesia","B","A rare condition in which stimulating one sense triggers an involuntary experience in another, such as seeing colors when hearing music."],
["Priming","B","Exposure to one stimulus, often unconsciously, influences how you perceive or respond to a later stimulus. It appears in both 1.6 and 2.2."],
["McGurk effect","B","Seeing lips say one syllable while hearing another makes you perceive a third. Vision and hearing interact.",1],
["Thalamus (sensory relay)","B","The brain's sensory switchboard. It relays every sense except smell to the right cortical area."],

["Hue","V","The color we experience, determined by the wavelength of light. Short wavelengths look blue-violet and long wavelengths look red.",1],
["Intensity (light)","V","The amount of energy in a light wave, determined by its amplitude. We perceive it as brightness.",1],
["Cornea","V","The clear, protective outer layer at the front of the eye that bends and helps focus incoming light."],
["Pupil","V","The adjustable opening in the center of the eye through which light enters."],
["Iris","V","The colored ring of muscle around the pupil. It dilates or constricts the pupil to control how much light enters."],
["Lens","V","The clear, flexible structure behind the pupil that changes shape to focus images on the retina."],
["Accommodation (lens)","V","The lens changing shape to focus near or far objects on the retina. Thicker for near, thinner for far. Not the same as schema accommodation in 2.2."],
["Retina","V","The light-sensitive inner surface at the back of the eye. Its rods and cones transduce light into neural signals."],
["Photoreceptors","V","Retinal cells (rods and cones) that react to light and convert it into electrical signals."],
["Rods","V","Retinal receptors that detect black, white, and gray. They work in dim light, handle peripheral vision, and are more numerous than cones."],
["Cones","V","Retinal receptors concentrated in the fovea. They detect color and fine detail and work in bright light. Cones = Color."],
["Fovea","V","The central focal point of the retina, packed with cones. Vision is sharpest here."],
["Bipolar cells","V","Retinal neurons that receive signals from rods and cones and pass them to ganglion cells.",1],
["Ganglion cells","V","Retinal neurons whose axons bundle together to form the optic nerve. Some respond in opposing color pairs, which helps explain afterimages."],
["Optic nerve","V","The nerve that carries neural impulses from the eye to the brain, via the thalamus to the occipital lobe."],
["Blind spot","V","The point where the optic nerve leaves the eye. There are no receptor cells there, so it creates a small blind area that the brain fills in."],
["Nearsightedness","V","Near objects are clear but distant objects are blurry, because the image focuses in front of the retina."],
["Farsightedness","V","Distant objects are clear but near objects are blurry, because the image focuses behind the retina."],
["Trichromatic theory","V","Young-Helmholtz theory: the retina has three types of cones, most sensitive to red, green, or blue. Their combined activity produces every color."],
["Opponent-process theory","V","Neural cells, such as ganglion cells and cells in the thalamus, work in opposing pairs (red-green, blue-yellow, black-white). When one is stimulated, its partner is inhibited. This explains afterimages."],
["Afterimages","V","An image that lingers after the stimulus is removed. After staring at green, a white wall looks red, because the fatigued green side of the pair rebounds."],
["Dichromatism","V","Having only two types of functioning cones, so certain colors are hard to tell apart (most often red-green). The most common type of color vision deficiency."],
["Monochromatism","V","Having only one type of cone or none, so the world is seen in shades of gray. Total color blindness, which is rare."],
["Prosopagnosia","V","Face blindness: the inability to recognize familiar faces even though the eyes work fine. It usually results from damage to the fusiform face area in the temporal lobe."],
["Blindsight","V","Responding to visual stimuli without consciously seeing them, after damage to the visual cortex. This shows that vision has a conscious track and an unconscious one."],
["Feature detectors","V","Neurons in the visual cortex that respond to specific features such as edges, lines, angles, and movement (Hubel & Wiesel).",1],
["Parallel processing","V","Processing many aspects of a stimulus, such as color, motion, form, and depth, at the same time.",1],
["Sclera","V","The tough white outer coat of the eyeball (the 'white of the eye'). At the front it becomes the clear cornea.",1],
["Choroid","V","The blood-vessel layer between the sclera and retina. It nourishes the retina, and its dark pigment absorbs stray light.",1],
["Aqueous humor","V","The watery fluid between the cornea and lens that nourishes the front of the eye and maintains its pressure.",1],
["Vitreous humor","V","The clear gel that fills the main chamber of the eyeball, keeping it round. Light passes through it to reach the retina.",1],
["Ciliary muscles","V","Muscles attached to the lens that change its shape. They are what make lens accommodation possible.",1],
["Optic chiasm","V","The X-shaped point where the optic nerves partially cross, so each visual field half goes to the opposite brain hemisphere.",1],
["Visual cortex","V","The area of the occipital lobe that receives and processes visual information, where feature detectors are found.",1],

["Frequency (sound)","H","The number of complete sound waves that pass a point per second, measured in hertz (Hz). We hear it as pitch."],
["Amplitude (sound)","H","The height of a sound wave. We hear it as loudness, measured in decibels (dB). Prolonged sound above about 85 dB damages hearing."],
["Wavelength (sound)","H","The distance from one wave peak to the next. Short wavelength means high frequency and high pitch."],
["Pinna","H","The visible outer ear. It collects sound waves and funnels them into the ear canal."],
["Ear canal","H","The tube that channels sound from the pinna to the eardrum."],
["Eardrum (tympanic membrane)","H","A thin membrane that vibrates when sound waves hit it. It marks the boundary between the outer ear and the middle ear."],
["Ossicles","H","Three tiny middle-ear bones, the hammer, anvil, and stirrup (malleus, incus, stapes), that amplify vibrations and pass them to the cochlea's oval window."],
["Eustachian tube","H","A canal from the middle ear to the throat that equalizes pressure on both sides of the eardrum. It is why your ears pop on a plane."],
["Cochlea","H","The snail-shaped, fluid-filled tube in the inner ear. Vibrations ripple its fluid and bend hair cells on the basilar membrane, and that is where transduction happens."],
["Basilar membrane","H","The membrane inside the cochlea that is lined with hair cells. Where it vibrates the most tells the brain the pitch (place theory)."],
["Hair cells","H","Auditory receptors on the basilar membrane that bend in response to fluid waves and trigger the auditory nerve. Damaged hair cells do not grow back."],
["Auditory nerve","H","Carries neural signals from the cochlea's hair cells to the brain, via the thalamus to the auditory cortex in the temporal lobe."],
["Place theory","H","Explains high-pitched sounds: different frequencies stimulate different places along the basilar membrane, like keys on a piano."],
["Frequency theory","H","Explains low-pitched sounds: the whole basilar membrane vibrates, and the auditory nerve fires at the same rate as the sound wave. A 100 Hz tone produces 100 impulses per second."],
["Volley theory","H","Explains mid-range pitches (about 1,000 to 4,000 Hz): neurons take turns firing in rapid succession so that, as a group, they match frequencies too fast for any single neuron."],
["Sound localization","H","Determining where a sound comes from. The ear closer to the sound hears it slightly sooner and slightly louder."],
["Conduction deafness","H","Hearing loss caused by damage to the mechanical system that conducts sound to the cochlea, such as the eardrum or ossicles. Hearing aids can help."],
["Sensorineural deafness","H","Hearing loss caused by damage to the cochlea's hair cells or to the auditory nerve. It is the most common type and often comes from aging or loud noise."],
["Cochlear implant","H","A device that converts sounds into electrical signals and stimulates the auditory nerve directly, bypassing damaged hair cells."],
["Oval window","H","The membrane at the entrance to the cochlea. The stirrup pushes on it, sending pressure waves through the cochlear fluid.",1],
["Round window","H","A membrane below the oval window that bulges outward to release the pressure wave, letting the cochlear fluid move.",1],
["Auditory cortex","H","The area of the temporal lobe that receives and interprets sound information from the auditory nerve (via the thalamus).",1],

["Olfaction","O","The sense of smell, a chemical sense. Airborne molecules dissolve in the mucus of the olfactory epithelium and bind to olfactory receptors."],
["Olfactory bulb","O","The brain structure that receives signals from the olfactory receptors. Smell bypasses the thalamus and goes straight to the limbic system (amygdala and hippocampus), which is why smells trigger emotional memories."],
["Pheromones","O","Chemical signals released by an animal that affect the behavior or physiology of others of the same species. Their role in humans is debated."],
["Gustation","O","The sense of taste, a chemical sense. Taste receptors detect chemicals dissolved in saliva."],
["Taste buds","O","Structures on the tongue (and mouth) that hold the taste receptor cells. They are replaced every week or two and decline with age."],
["Taste receptors","O","Cells within taste buds that detect dissolved chemicals and send signals to the brain along the gustatory pathway."],
["Umami","O","The savory, meaty taste, from glutamate. It signals protein."],
["Oleogustus","O","A proposed sixth basic taste: the taste of fat."],
["Supertasters","O","People with more taste buds than average who are extra sensitive to tastes, especially bitter ones."],
["Medium tasters","O","The majority of people, who have an average number of taste buds and moderate sensitivity."],
["Nontasters","O","People with fewer taste buds and reduced sensitivity to tastes, especially bitterness."],

["Mechanoreceptors","T","Skin receptors that detect pressure, vibration, and texture."],
["Thermoreceptors","T","Skin receptors that detect warmth and cold."],
["Nociceptors","T","Sensory receptors that respond to potentially damaging stimuli (tissue damage, extreme heat, pressure, or chemicals) and signal pain."],
["Somatosensory cortex","T","The strip at the front of the parietal lobe that processes touch and body sensations. Sensitive areas like the lips and hands get more cortical space."],
["Gate-control theory","T","Melzack & Wall: a neurological gate in the spinal cord blocks or allows pain signals. Small fibers open it. Large-fiber activity (rubbing, massage) and brain activity (distraction, endorphins) close it."],
["Phantom limb sensation","T","Feeling sensations, including pain, in an amputated limb, because the brain's body map still includes the missing limb. It shows that sensation and pain happen in the brain."],
["Vestibular sense","T","The sense of balance and of head and body position and movement relative to gravity."],
["Semicircular canals","T","Three fluid-filled, ring-shaped tubes in the inner ear, each in a different plane. When fluid moves, it bends hair cells that signal head rotation. Dizziness after spinning comes from fluid that keeps moving."],
["Vestibular sacs","T","Inner-ear structures that detect head tilt and straight-line acceleration.",1],
["Vertigo","T","A spinning sensation that occurs when the vestibular system sends signals that conflict with the other senses."],
["Kinesthesis","T","The sense of the position and movement of your own body parts, from receptors in muscles, tendons, and joints. It is how you can touch your nose with your eyes closed."],

["Perception","P","The process of organizing and interpreting sensory information so we can recognize meaningful objects and events."],
["Bottom-up processing","P","Analysis that starts with raw sensory input and works up to the brain's integration of it, building a picture piece by piece, like a puzzle."],
["Top-down processing","P","Interpretation guided by prior knowledge, expectations, and experiences, such as reading messy handwriting because you know the words."],
["Perceptual set","P","A mental predisposition to perceive one thing and not another, shaped by expectations, emotions, motivation, and culture."],
["Context effects","P","The surroundings change what we perceive. The same shadowy figure looks more threatening at night than in daylight."],
["Culture and perception","P","Culture shapes what we notice. In the fish study, people from individualist cultures tended to see the lone fish as leading, while people from collectivist cultures tended to see it as being chased."],
["Gestalt psychology","P","The study of how people naturally organize sensations into meaningful wholes. The whole can differ from the sum of its parts."],
["Figure-ground","P","Organizing a scene into an object (the figure) that stands out from its surroundings (the ground), as in the vase/faces image."],
["Grouping","P","The perceptual tendency to organize stimuli into coherent groups, through proximity, similarity, closure, and continuity."],
["Proximity","P","A Gestalt grouping principle: we group objects that are close together."],
["Similarity","P","A Gestalt grouping principle: we group objects that look alike in color, shape, or size."],
["Closure","P","A Gestalt grouping principle: we fill in gaps to perceive a complete, whole object."],
["Continuity","P","A Gestalt grouping principle: we perceive smooth, continuous patterns instead of broken ones.",1],
["Attention","P","Mental focus on specific stimuli while other stimuli are ignored. Attention is limited."],
["Selective attention","P","Focusing conscious awareness on one particular stimulus among many."],
["Cocktail party effect","P","Tuning in to one voice in a noisy room, yet immediately noticing when someone across the room says your name."],
["Inattentional blindness","P","Failing to see visible objects when attention is directed elsewhere, as in the 'invisible gorilla' study. A big driving risk when texting."],
["Change blindness","P","Failing to notice changes in the environment. Magicians rely on it."],

["Depth perception","Q","The ability to see objects in three dimensions even though the retinal image is two-dimensional. It lets us judge distance."],
["Visual cliff","Q","Gibson & Walk's apparatus: a glass-covered drop-off. Crawling infants refuse to cross it, which suggests depth perception is present early and may be partly innate."],
["Binocular cues","Q","Depth cues that depend on both eyes working together."],
["Retinal disparity","Q","A binocular cue: the left and right eyes get slightly different images. The bigger the difference, the closer the object."],
["Convergence","Q","A binocular cue: the eyes turn inward more for close objects, and the brain reads that muscle strain as nearness."],
["Monocular cues","Q","Depth cues available to either eye alone. Artists use them to make flat paintings look 3D."],
["Relative size","Q","A monocular cue: if two objects are assumed to be similar in size, the one that casts a smaller retinal image looks farther away."],
["Interposition","Q","A monocular cue: an object that partially blocks another is seen as closer."],
["Texture gradient","Q","A monocular cue: surfaces close to us have coarse, distinct texture, and texture becomes finer and denser with distance."],
["Relative clarity","Q","A monocular cue: hazy, blurry objects look farther away than sharp, clear ones."],
["Linear perspective","Q","A monocular cue: parallel lines, such as railroad tracks, appear to converge with distance."],
["Relative height","Q","A monocular cue: objects higher in the visual field look farther away.",1],
["Relative motion (motion parallax)","Q","A monocular cue: when you move, near objects seem to zoom past and far objects seem to move with you.",1],
["Perceptual constancy","Q","Perceiving objects as unchanging (same color, shape, and size) even as lighting, distance, or angle change the retinal image."],
["Color constancy","Q","Perceiving familiar objects as having a consistent color even when the lighting changes what reaches the eye."],
["Shape constancy","Q","Perceiving an object as keeping its shape (a door is still a rectangle) even when viewing it from an angle changes the retinal image."],
["Size constancy","Q","Perceiving an object as the same size even as it moves closer or farther and its retinal image changes."],
["Apparent motion","Q","Perceiving movement where there is none."],
["Stroboscopic movement","Q","Apparent motion from a rapid series of slightly different still images, as in flipbooks and movies."],
["Phi phenomenon","Q","Apparent motion created when two or more adjacent lights blink on and off in quick succession, as on marquee signs and holiday light shows."],
["Autokinetic effect","Q","A stationary point of light in a dark room appears to move, because of tiny eye movements and the lack of reference points."],
["Perceptual adaptation","Q","The ability to adjust to changed sensory input, such as eventually functioning normally while wearing goggles that flip vision upside down."],

["Cognition","R","All the mental activities involved in acquiring, processing, storing, and using information, including thinking, knowing, remembering, and communicating."],
["Metacognition","R","Thinking about your own thinking, such as checking whether you really understand something or self-checking during a test."],
["Concept","R","A mental grouping of similar objects, events, ideas, or people, such as 'fruit.'"],
["Prototype","R","The most typical example or mental image of a concept. A robin is a prototype bird, while an ostrich takes longer to classify."],
["Schema","R","A mental framework that organizes and interprets information, such as the restaurant script: enter, order, eat, pay. Schemas shape perception (2.1) and thinking (2.2)."],
["Assimilation","R","Interpreting new information in terms of an existing schema, such as calling a zebra a 'striped horse.'"],
["Accommodation (schema)","R","Changing an existing schema, or creating a new one, to fit new information, such as learning that a zebra is its own animal."],
["Executive functions","R","Higher-level cognitive skills (planning, prioritizing, impulse control, working memory, flexible thinking) handled mainly by the prefrontal cortex. Think of them as the brain's CEO."],
["Creativity","R","The ability to produce new and valuable ideas."],
["Divergent thinking","R","Expanding the number of possible solutions, such as brainstorming many uses for a paper clip. Creative thinking that branches out."],
["Convergent thinking","R","Narrowing many options down to the single best solution, such as solving a riddle or a multiple-choice question."],

["Algorithm","J","A methodical, step-by-step procedure that guarantees a solution but can be slow, like following a recipe exactly or trying every combination."],
["Heuristic","J","A simple thinking shortcut that lets us judge and solve problems quickly. It is efficient but more error-prone than an algorithm."],
["Representativeness heuristic","J","Judging how likely something is by how well it matches a prototype, often while ignoring base rates. For example, assuming a quiet person with glasses is a librarian."],
["Availability heuristic","J","Judging how likely an event is by how easily examples come to mind, such as fearing plane crashes after seeing one on the news."],
["Framing","J","How an issue is worded changes decisions. A '90% survival rate' sounds better than a '10% death rate,' even though they mean the same thing."],
["Gambler's fallacy","J","Believing that past random events change the odds of future ones, such as thinking heads is 'due' after several tails."],
["Sunk-cost fallacy","J","Continuing a failing course of action because of what you have already invested (time, money, effort), such as sitting through a bad movie because you paid for it."],
["Mental set","J","A tendency to approach a problem in one particular way, usually one that worked before, even when a new approach would be better."],
["Functional fixedness","J","The tendency to think of objects only in terms of their usual functions, so you don't see a book as a doorstop or a coin as a screwdriver."],
["Insight","J","A sudden 'aha!' realization of a problem's solution, in contrast to strategy-based solutions.",1],
["Confirmation bias","J","Searching for information that supports your existing beliefs and ignoring evidence that contradicts them.",1],
["Overconfidence","J","Being more confident than correct, which means overestimating the accuracy of your beliefs and judgments.",1],
["Belief perseverance","J","Clinging to your initial beliefs even after the basis for them has been discredited.",1]
];

const sh=a=>{a=[...a];for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const X=d=>d[3]?'<span class="xtra" title="Not on the class slides, but useful for the AP exam">★ beyond slides</span>':"";
function loadMiss(){try{return new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){return new Set()}}
function saveMiss(){try{localStorage.setItem(KEY,JSON.stringify([...miss]))}catch(e){}}
const cx=(label,href)=>`<a class="cx" href="${href}"><i class="fa-solid fa-link"></i>${label}</a>`;

let mode="notes",scope="all",cats=new Set(Object.keys(C)),miss=loadMiss(),missOnly=false;
const MODES={notes:"Notes",gloss:"Glossary",cmp:"Compare",conn:"Connections",sleep:"Sleep Cycle",path:"Pathways",anat:"Eye & Ear",lab:"Labs",flash:"Flashcards",quiz:"Quiz",match:"Matching",type:"Type-In",app:"Scenarios",aaq:"AAQ Practice"};

const TERM_MODES=["gloss","flash","quiz","match","type"];

function pool(n){let p=sh(D.map((d,k)=>k).filter(k=>cats.has(D[k][1])&&(!missOnly||miss.has(D[k][0]))));return scope=="rand"?p.slice(0,n):p}

function bar(){
  $("modes").innerHTML=Object.keys(MODES).map(k=>`<button class="tab ${k==mode?"on":""}" onclick="setMode('${k}')"><i class="fa-solid fa-${IC[k]}"></i> ${MODES[k]}</button>`).join("");
  $("flt").style.display=TERM_MODES.includes(mode)?"":"none";
  $("scope").innerHTML=[["rand","Random 10"],["all","All Terms"]].map(([k,v])=>`<button class="${k==scope?"on":""}" onclick="scope='${k}';go()">${v}</button>`).join("")+`<button class="${missOnly?"on":""}" onclick="missOnly=!missOnly;go()">Missed (${miss.size})</button>`+(miss.size?`<button onclick="miss.clear();saveMiss();missOnly=false;go()">Clear missed</button>`:"");
  $("cats").innerHTML=`<button onclick="cats=new Set(Object.keys(C));go()">All Categories</button>`+Object.entries(C).map(([k,v])=>`<button class="${cats.has(k)?"on":""}" onclick="tog('${k}')">${v}</button>`).join("");
  $("cnt").innerHTML=`<span><i class="fa-solid fa-circle-check" style="color:#3ecf8e"></i> Terms: ${D.filter(d=>cats.has(d[1])).length}</span><span><i class="fa-solid fa-triangle-exclamation" style="color:#ffb454"></i> Missed: ${miss.size}</span>`;
}
function setMode(k){mode=k;go();window.scrollTo({top:0})}
function tog(k){cats.has(k)?cats.delete(k):cats.add(k);if(!cats.size)cats.add(k);go()}
function addMiss(k){miss.add(D[k][0]);saveMiss()}
function delMiss(k){miss.delete(D[k][0]);saveMiss()}

let Q=[],i=0,sc=0,flip=false,rv=false;
function go(){
  bar();
  Q=pool(mode=="match"?6:10);i=0;sc=0;flip=false;
  if(TERM_MODES.includes(mode)&&mode!=="gloss"&&!Q.length){$("main").innerHTML='<div class="card">No terms match your filters. Turn on more categories or switch off "Missed" to continue.</div>';return}
  ({notes,gloss,cmp,conn,sleep,path,anat,lab,flash,quiz,match,type:typ,app,aaq})[mode]();
}
function prog(){return `<div class="pg"><i style="width:${Q.length?i/Q.length*100:0}%"></i></div>`}
function done(){
  $("main").innerHTML=`<div class="card"><h2>Session complete</h2><p>Score: <b>${sc}</b> / ${Q.length}</p><p class="mu">${miss.size?`${miss.size} term(s) are saved in your Missed list. Tap "Missed" in the filters to drill only those.`:"No missed terms. Nice work."}</p><div class="row"><button class="on" onclick="go()">Restart</button><button onclick="missOnly=true;go()">Drill missed</button></div></div>`;
  bar();
}

{id:"n15",code:"1.5 · UNIT 1 BRIDGE",t:"Sleep & Consciousness",h:`
<p><b>Consciousness</b> is awareness of yourself and your environment. <b>Altered states</b> differ from normal waking awareness, such as sleep and dreams, hypnosis, meditation, psychoactive drugs, daydreaming, and coma.</p>
<h3>The body clock</h3>
<ul><li><b>Circadian rhythm</b>: a roughly 24-hour cycle of sleep and wake, body temperature, and hormones. Alertness dips mid-afternoon and rises in the evening.</li>
<li><b>SCN</b> (in the <b>hypothalamus</b>): light hits the retina, the retina signals the SCN, and the SCN tells the <b>pineal gland</b> to cut <b>melatonin</b>. In darkness, melatonin rises and you get sleepy.</li>
<li>Disruptions such as <b>jet lag</b>, shift work, and late-night screens (bright light delays melatonin) hurt mood, alertness, and thinking.</li>
<li>Teens' rhythms naturally shift later ("night owls"), and older adults shift earlier.</li></ul>
<h3>Stages of sleep (one cycle ≈ 90 minutes, 4 to 6 cycles per night)</h3>
<div class="tw"><table class="tb"><tr><th>Stage</th><th>EEG</th><th>What's happening</th></tr>
<tr><td>Awake, alert</td><td>Beta</td><td>Fast, low-amplitude waves</td></tr>
<tr><td>Awake, relaxed</td><td>Alpha</td><td>Drowsy, eyes closed, right before sleep</td></tr>
<tr><td>NREM-1</td><td>Theta</td><td>Light, transitional sleep with <b>hypnagogic sensations</b> (falling, a body jerk, hearing your name)</td></tr>
<tr><td>NREM-2</td><td>Sleep spindles, K-complexes</td><td>Deeper relaxation, about half the night</td></tr>
<tr><td>NREM-3</td><td>Delta (large and slow)</td><td>Deep sleep, hardest to wake. Physical restoration and growth hormone. <b>Sleepwalking</b> and night terrors happen here.</td></tr>
<tr><td>REM</td><td>Beta-like (active)</td><td><b>Paradoxical sleep</b>: an active brain in a paralyzed body. Vivid dreams and memory consolidation.</td></tr></table></div>
<ul><li>The typical path is 1 → 2 → 3 → 2 → REM. <b>Deep NREM-3 dominates early</b> in the night, and <b>REM periods get longer toward morning.</b></li>
<li><b>REM rebound</b>: after REM deprivation (sleep loss, stress, alcohol, sleeping pills), the body makes up for it with extra REM.</li>
<li>Other animals have REM too, which suggests REM serves a biological need.</li></ul>
<div class="tip">The slides say "Stage 1 = alpha waves" and "Stages 3 &amp; 4." The current model (and the 2024 CED) uses <b>NREM-1, 2, 3</b>. Alpha waves come from the relaxed state <i>right before</i> sleep, and NREM-1 itself shows theta. If you see "Stage 4" on old practice tests, read it as deep NREM-3.</div>
<h3>Why do we dream?</h3>
<ul><li><b>Activation-synthesis theory</b>: random neural firing during REM (from the brainstem) is stitched into a story by the cortex. Dreams are the brain making sense of noise.</li>
<li><b>Consolidation theory</b>: sleep and dreams process and lock in the day's memories. Study, then sleep.</li>
<li>Other theories you might see: Freud's wish-fulfillment theory (manifest vs. latent content, which has little scientific support), the neural development theory (REM builds pathways, which fits infants getting so much REM), and the cognitive development theory (dreams reflect what we know). <span class="xtra">★ beyond slides</span></li></ul>
<h3>Why sleep matters</h3>
<p>Sleep protects (we were safer still at night), restores (tissue repair, clearing waste), consolidates memories, boosts creativity, and supports growth. <b>Sleep deprivation</b> lowers attention, memory, mood, and immunity, raises accident risk, and increases ghrelin (hunger) while decreasing leptin (fullness).</p>
<h3>Sleep disorders</h3>
<div class="tw"><table class="tb"><tr><th>Disorder</th><th>Key feature</th><th>Stage tie</th></tr>
<tr><td>Insomnia</td><td>Persistent trouble falling or staying asleep</td><td>n/a</td></tr>
<tr><td>Narcolepsy</td><td>Sudden sleep attacks, sometimes cataplexy (sudden loss of muscle tone)</td><td>Falls straight into REM</td></tr>
<tr><td>Sleep apnea</td><td>Breathing stops repeatedly, loud snoring, daytime sleepiness</td><td>Fragmented sleep</td></tr>
<tr><td>Somnambulism</td><td>Sleepwalking</td><td>NREM-3</td></tr>
<tr><td>Night terrors <span class="xtra">★</span></td><td>Terrified arousal, not remembered</td><td>NREM-3</td></tr>
<tr><td>REM sleep behavior disorder</td><td>Acting out dreams, because REM paralysis is missing</td><td>REM</td></tr></table></div>
<div class="tip">Sleepwalking (NREM-3) and REM sleep behavior disorder (REM) can look alike. If the person is <b>acting out a dream</b>, it's REM behavior disorder. Nightmares are REM; night terrors are NREM-3.</div>
<div class="cxs">${cx("Unit 1 · Hypothalamus (SCN)","unit1.html")}${cx("Unit 1 · Melatonin","unit1.html")}${cx("Unit 1 · EEG","unit1.html")}${cx("Unit 1 · Depressants suppress REM","unit1.html")}${cx("Unit 1 · Ghrelin & leptin","unit1.html")}</div>`},

{id:"n16a",code:"1.6A · UNIT 1 BRIDGE",t:"Sensation Basics",h:`
<p><b>Sensation</b> is your receptors and nervous system receiving and representing stimulus energy. <b>Perception</b> (2.1) is the brain organizing and interpreting that input. The bridge between them is <b>transduction</b>, which converts stimulus energy into neural impulses.</p>
<h3>Detecting a stimulus</h3>
<ul><li><b>Absolute threshold</b>: the minimum intensity detected <b>50% of the time</b>, such as a candle flame 30 miles away on a clear, dark night.</li>
<li><b>Signal detection theory</b> <span class="xtra">★</span>: detection also depends on psychological factors (expectations, motivation, fatigue). A parent hears a baby's whimper but sleeps through traffic.</li>
<li><b>Subliminal</b> <span class="xtra">★</span> stimuli are below the absolute threshold. They can briefly prime responses, but they don't produce lasting persuasion.</li></ul>
<h3>Detecting change</h3>
<ul><li><b>Difference threshold (JND)</b>: the smallest change detected 50% of the time.</li>
<li><b>Weber's law</b>: the JND is a constant <b>proportion</b>, not a constant amount. Adding 1 lb to a 10 lb bag is noticeable, but adding 1 lb to a 100 lb bag isn't. You'd need about 10 lb.</li>
<li><b>Sensory adaptation</b>: constant, unchanging stimulation leads to reduced sensitivity, like not noticing a ticking clock, your clothes, or your own house's smell. It frees attention for <i>change</i>, which is what matters for survival.</li></ul>
<div class="ex">Sugar in tea (from the slides): one teaspoon is obvious in barely sweet tea but unnoticeable in very sweet tea. That's Weber's law.</div>
<h3>Senses working together</h3>
<ul><li><b>Sensory interaction</b>: one sense influences another. Food tastes bland with a stuffy nose, and in the McGurk effect <span class="xtra">★</span> vision changes what you hear.</li>
<li><b>Synesthesia</b>: one sense involuntarily triggers another, such as seeing colors when hearing music.</li>
<li><b>Priming</b>: an earlier stimulus influences how you perceive a later one. It shows up again in 2.2 decision-making.</li></ul>
<div class="tip">Sensory <b>adaptation</b> happens at the receptor level (sensitivity drops). Habituation (Unit 3, learning) is a decrease in <i>response</i> to a repeated stimulus. Also, the difference between sensory interaction and synesthesia: in interaction, senses influence each other normally; in synesthesia, one sense actually creates an experience in another.</div>
<div class="cxs">${cx("Unit 1 · Sensory (afferent) neurons","unit1.html")}${cx("Unit 1 · Thalamus","unit1.html")}${cx("Unit 1 · Threshold / all-or-none","unit1.html")}${cx("Unit 0 · Operational definition (the 50% rule)","unit0.html")}</div>`},

{id:"n16b",code:"1.6B · UNIT 1 BRIDGE",t:"Vision",h:`
<p>Light's <b>wavelength</b> determines <b>hue</b> (color), and its <b>amplitude</b> determines <b>intensity</b> (brightness).</p>
<h3>Path of light</h3>
<p><b>Cornea</b> → <b>pupil</b> (size set by the <b>iris</b>) → <b>lens</b> (focuses by <b>accommodation</b>) → <b>retina</b>: <b>rods and cones</b> transduce light → bipolar cells → <b>ganglion cells</b> → <b>optic nerve</b> (leaving at the <b>blind spot</b>) → optic chiasm → <b>thalamus</b> → <b>visual cortex, occipital lobe</b>. See the Pathways tab.</p>
<div class="tw"><table class="tb"><tr><th></th><th>Rods</th><th>Cones</th></tr>
<tr><td>Detect</td><td>Black, white, gray</td><td>Color and fine detail</td></tr>
<tr><td>Best in</td><td>Dim light, peripheral vision</td><td>Bright light, center vision</td></tr>
<tr><td>Location</td><td>Periphery of the retina</td><td>Packed in the <b>fovea</b></td></tr>
<tr><td>Number</td><td>About 120 million</td><td>About 6 million</td></tr></table></div>
<h3>Focus problems</h3>
<ul><li><b>Nearsighted</b>: near objects are clear, far ones blurry. The image focuses <b>in front of</b> the retina.</li>
<li><b>Farsighted</b>: far objects are clear, near ones blurry. The image focuses <b>behind</b> the retina.</li></ul>
<h3>Color vision: two theories, both correct at different stages</h3>
<ul><li><b>Trichromatic (Young-Helmholtz)</b>: three cone types (red, green, blue) in the <b>retina</b>. It explains color mixing and color deficiencies.</li>
<li><b>Opponent-process</b>: opposing pairs (red-green, blue-yellow, black-white) in <b>ganglion cells and the thalamus</b>. It explains <b>afterimages</b>: stare at green, look at white, and you see red. Try it in the Labs tab.</li>
<li><b>Dichromatism</b>: two working cone types (red-green deficiency is most common). <b>Monochromatism</b>: one cone type or none, so vision is in grays.</li></ul>
<h3>When the brain, not the eye, is damaged</h3>
<ul><li><b>Prosopagnosia</b>: can't recognize faces (fusiform face area, temporal lobe).</li>
<li><b>Blindsight</b>: visual cortex damage, but the person still responds to things they say they can't see. Evidence for an unconscious visual track.</li>
<li><b>Feature detectors</b> <span class="xtra">★</span> (Hubel &amp; Wiesel) respond to edges, lines, and motion. <b>Parallel processing</b> <span class="xtra">★</span> handles color, motion, form, and depth at once.</li></ul>
<p><b>Supporting structures</b> <span class="xtra">★</span>: the <b>sclera</b> (white outer coat), <b>choroid</b> (blood-vessel layer), <b>aqueous humor</b> (fluid behind the cornea), <b>vitreous humor</b> (gel filling the eyeball), and <b>ciliary muscles</b> (reshape the lens). The <b>Eye &amp; Ear</b> tab has a clickable diagram of every part plus a retina close-up.</p>
<div class="tip">"Accommodation" means two different things in this unit. <b>Lens accommodation</b> (1.6) is the lens changing shape to focus. <b>Schema accommodation</b> (2.2) is changing a mental framework. Read the context.</div>
<div class="cxs">${cx("Unit 1 · Occipital lobes","unit1.html")}${cx("Unit 1 · Temporal lobes (faces)","unit1.html")}${cx("Unit 1 · Thalamus","unit1.html")}${cx("1.5 · Retina → SCN (light resets the clock)","#n15")}</div>`},

{id:"n16c",code:"1.6C · UNIT 1 BRIDGE",t:"Hearing",h:`
<p>Sound waves are compressions and expansions of air. <b>Amplitude</b> determines <b>loudness</b> (decibels), and <b>frequency</b> (hertz) determines <b>pitch</b>. Short wavelength = high frequency = high pitch.</p>
<h3>Path of sound</h3>
<p><b>Outer ear:</b> pinna → ear canal → <b>eardrum</b>. <b>Middle ear:</b> <b>ossicles</b> (hammer, anvil, stirrup) amplify the vibration, and the Eustachian tube equalizes pressure. <b>Inner ear:</b> oval window → fluid in the <b>cochlea</b> ripples the <b>basilar membrane</b>, bending <b>hair cells</b> (this is transduction) → <b>auditory nerve</b> → thalamus → <b>auditory cortex, temporal lobe</b>.</p>
<p>The <b>oval window</b> <span class="xtra">★</span> takes the stirrup's push into the cochlea, and the <b>round window</b> <span class="xtra">★</span> bulges to release the pressure. The <b>Eye &amp; Ear</b> tab has a clickable ear and an uncoiled cochlea with a frequency slider.</p>
<h3>Pitch theories</h3>
<div class="tw"><table class="tb"><tr><th>Theory</th><th>Pitch range</th><th>Idea</th></tr>
<tr><td>Place</td><td><b>High</b></td><td>Different frequencies vibrate different <b>places</b> on the basilar membrane, like piano keys</td></tr>
<tr><td>Frequency</td><td><b>Low</b></td><td>The whole membrane vibrates, and nerve firing rate matches the sound's frequency (100 Hz → 100 impulses per second)</td></tr>
<tr><td>Volley</td><td><b>Middle</b> (about 1,000–4,000 Hz)</td><td>Neurons take turns firing ("volleys") to match frequencies too fast for one neuron</td></tr></table></div>
<div class="ex">Memory hook: <b>P</b>lace for <b>P</b>iccolo (high), <b>F</b>requency for <b>F</b>oghorn (low), and a <b>V</b>olley of neurons fills the middle.</div>
<h3>Sound localization</h3>
<p>The ear closer to the sound hears it <b>slightly sooner and louder</b>. Sounds directly in front of or behind you are hard to place because both ears get the same input.</p>
<h3>Hearing loss</h3>
<ul><li><b>Conduction deafness</b>: a mechanical problem (eardrum, ossicles), so sound can't reach the cochlea. Hearing aids help.</li>
<li><b>Sensorineural deafness</b>: damage to the hair cells or auditory nerve, often from aging or loud noise. Hair cells don't regrow.</li>
<li><b>Cochlear implant</b>: bypasses damaged hair cells and stimulates the auditory nerve directly. It works for sensorineural loss when the nerve is intact.</li></ul>
<div class="cxs">${cx("Unit 1 · Temporal lobes","unit1.html")}${cx("Unit 1 · Action potential firing rate","unit1.html")}${cx("1.6E · Inner ear also holds the vestibular system","#n16e")}</div>`},

{id:"n16d",code:"1.6D · UNIT 1 BRIDGE",t:"Smell, Taste, Touch & Pain",h:`
<h3>Chemical senses</h3>
<ul><li><b>Olfaction</b>: molecules dissolve in the mucus of the olfactory epithelium → olfactory receptors → <b>olfactory bulb</b> → straight to the limbic system (amygdala, hippocampus) and olfactory cortex. <b>Smell is the only sense that bypasses the thalamus</b>, which is why smells trigger vivid emotional memories.</li>
<li><b>Pheromones</b>: chemical signals that affect members of the same species. Clear in animals, debated in humans.</li>
<li><b>Gustation</b>: taste buds hold <b>taste receptors</b> that detect chemicals dissolved in saliva. Basic tastes: <b>sweet</b> (energy), <b>salty</b> (sodium), <b>sour</b> (possible spoilage), <b>bitter</b> (possible toxins), <b>umami</b> (savory, protein), and <b>oleogustus</b> (fat, a proposed sixth).</li>
<li>Taster types: <b>supertasters</b> (more taste buds, very sensitive to bitter), <b>medium tasters</b> (most people), <b>nontasters</b> (fewer taste buds).</li>
<li>Smell and taste interact (<b>sensory interaction</b>): much of "flavor" is actually smell.</li></ul>
<h3>Touch</h3>
<ul><li>Skin receptors: <b>mechanoreceptors</b> (pressure, texture), <b>thermoreceptors</b> (temperature), <b>nociceptors</b> (pain).</li>
<li>Signals go through the spinal cord → <b>thalamus</b> → <b>somatosensory cortex</b> (parietal lobe). Lips and hands get the most cortical space.</li></ul>
<h3>Pain</h3>
<ul><li>Pain signals possible harm. <b>Nociceptors</b> → spinal cord → thalamus → somatosensory cortex (where it is and how strong) <i>and</i> the limbic system (how bad it feels).</li>
<li><b>Gate-control theory</b> (Melzack &amp; Wall): a "gate" in the spinal cord. Small fibers open it (pain gets through). Large fibers close it (rubbing a bumped elbow, massage), and so can the brain (distraction, <b>endorphins</b>).</li>
<li><b>Phantom limb sensation</b>: feeling a missing limb, because the brain's body map is still active. Pain is made in the brain.</li>
<li>Pain is <b>biopsychosocial</b> <span class="xtra">★</span>: biology (nociceptors), psychology (attention, expectations, placebo), and social-cultural factors (others' presence, norms).</li></ul>
<div class="cxs">${cx("Unit 1 · Endorphins","unit1.html")}${cx("Unit 1 · Substance P","unit1.html")}${cx("Unit 1 · Somatosensory cortex","unit1.html")}${cx("Unit 1 · Amygdala & hippocampus","unit1.html")}${cx("Unit 1 · Biopsychosocial approach","unit1.html")}${cx("Unit 0 · Placebo effect","unit0.html")}</div>`},

{id:"n16e",code:"1.6E · UNIT 1 BRIDGE",t:"Vestibular & Kinesthetic Senses",h:`
<ul><li><b>Vestibular sense</b>: balance and head position relative to gravity. It lives in the inner ear.
<ul><li><b>Semicircular canals</b>: three fluid-filled rings in different planes. Fluid movement bends hair cells, which signal head rotation.</li>
<li><b>Vestibular sacs</b> <span class="xtra">★</span>: detect tilt and straight-line acceleration.</li></ul></li>
<li>Dizziness after spinning: the canal fluid keeps moving after you stop. <b>Vertigo</b> and motion sickness come from conflict between vestibular and visual signals.</li>
<li><b>Kinesthesis</b>: the position and movement of your own body parts, from receptors in muscles, tendons, and joints. It's how you touch your nose with your eyes closed.</li></ul>
<div class="tip">Vestibular = <b>balance and head position</b> (inner ear). Kinesthetic = <b>where your limbs are and how they move</b> (muscles and joints). A gymnast on a beam uses both.</div>
<div class="cxs">${cx("Unit 1 · Cerebellum (balance & coordination)","unit1.html")}${cx("1.6C · Same hair-cell idea as the cochlea","#n16c")}</div>`},

{id:"n21a",code:"2.1A",t:"Perception: Processing, Influences, Gestalt & Attention",h:`
<p><b>Perception</b> is organizing and interpreting sensory information into meaningful objects and events. Sensation is the input; perception is the brain making sense of it.</p>
<h3>Two directions of processing</h3>
<ul><li><b>Bottom-up</b>: starts with raw sensory data and builds up piece by piece (data-driven). Example: examining an unfamiliar object feature by feature.</li>
<li><b>Top-down</b>: uses knowledge, expectations, and experience to interpret input (concept-driven). Example: reading "c_t" as "cat," or hearing song lyrics once you've seen them.</li>
<li>We use both at the same time.</li></ul>
<h3>Internal influences</h3>
<ul><li><b>Schemas</b>: mental frameworks. Our face schema is so strong that we see faces in clouds and outlets.</li>
<li><b>Perceptual set</b>: a readiness to perceive something a certain way. If you expect a scary movie, a normal creak sounds terrifying. In the blind french fry test, your "favorite" fries may lose the blind taste test.</li></ul>
<h3>External influences</h3>
<ul><li><b>Context</b>: the same object looks different in different surroundings, like a coat stand at night or a heron on a trail cam.</li>
<li><b>Culture</b>: in the fish study, individualist cultures tended to see the lone fish as <i>leading</i>, while collectivist cultures tended to see it as <i>being chased</i>.</li></ul>
<h3>Gestalt organization (the whole is more than its parts)</h3>
<ul><li><b>Figure-ground</b>: separating the object from its background (vase vs. two faces).</li>
<li><b>Grouping</b>: <b>proximity</b> (near things belong together), <b>similarity</b> (alike things belong together), <b>closure</b> (we fill gaps to see a whole), and <b>continuity</b> <span class="xtra">★</span> (we prefer smooth paths). See the Labs tab.</li></ul>
<h3>Attention</h3>
<ul><li><b>Selective attention</b>: focusing on one thing among many. Your conscious mind handles only a small part of what you sense.</li>
<li><b>Cocktail party effect</b>: you follow one conversation, yet your name cuts through the noise.</li>
<li><b>Inattentional blindness</b>: missing visible objects while focused elsewhere (the "invisible gorilla"). A big reason texting while driving is dangerous.</li>
<li><b>Change blindness</b>: missing changes in a scene, such as a conversation partner being swapped. Magicians rely on it.</li></ul>
<div class="tip">Inattentional blindness = never noticing <b>something present</b>. Change blindness = not noticing that <b>something changed</b>.</div>
<div class="cxs">${cx("1.6 · Sensation is bottom-up input","#n16a")}${cx("2.2 · Schemas, assimilation & accommodation","#n22")}${cx("Unit 0 · Replication (the gorilla study replicates)","unit0.html")}</div>`},

{id:"n21b",code:"2.1B",t:"Visual Perception: Depth, Constancy & Motion",h:`
<p><b>Depth perception</b> turns a 2D retinal image into a 3D world. In the <b>visual cliff</b> (Gibson &amp; Walk), crawling infants won't cross a glass-covered drop, which suggests depth perception is present early and partly innate. Newborn animals show it too.</p>
<div class="tw"><table class="tb"><tr><th>Cue</th><th>Type</th><th>Closer object looks...</th></tr>
<tr><td>Retinal disparity</td><td>Binocular</td><td>More different between the two eyes</td></tr>
<tr><td>Convergence</td><td>Binocular</td><td>Eyes turn inward more (more muscle strain)</td></tr>
<tr><td>Relative size</td><td>Monocular</td><td>Larger (when objects are assumed to be the same size)</td></tr>
<tr><td>Interposition</td><td>Monocular</td><td>In front, blocking the other</td></tr>
<tr><td>Texture gradient</td><td>Monocular</td><td>Coarser, more distinct texture</td></tr>
<tr><td>Relative clarity</td><td>Monocular</td><td>Sharper (hazy = far)</td></tr>
<tr><td>Linear perspective</td><td>Monocular</td><td>Farther from where parallel lines converge</td></tr>
<tr><td>Relative height <span class="xtra">★</span></td><td>Monocular</td><td>Lower in the visual field</td></tr>
<tr><td>Relative motion <span class="xtra">★</span></td><td>Monocular</td><td>Zooms past faster when you move</td></tr></table></div>
<div class="tip">The slide says "objects with finer details are seen as closer." Here's the precise version: nearby surfaces show <b>coarse, distinct</b> texture, which gets <b>finer and denser</b> with distance. Seeing <i>clear detail</i> means near, and texture packed tightly together means far.</div>
<div class="ex">Is it monocular or binocular? Cover one eye. If the cue still works (a painting, a photo, a movie), it's monocular. Retinal disparity and convergence are the only two binocular cues you need for AP.</div>
<h3>Perceptual constancies</h3>
<ul><li><b>Color constancy</b>: a red apple still looks red in dim or yellow light.</li>
<li><b>Shape constancy</b>: an opening door still looks rectangular, even though its retinal image is a trapezoid.</li>
<li><b>Size constancy</b>: far-away people don't look tiny, because the brain factors in distance. Misjudged distance drives illusions like the Ponzo and moon illusions <span class="xtra">★</span>.</li></ul>
<h3>Apparent motion</h3>
<ul><li><b>Stroboscopic movement</b>: rapid still frames look like motion (movies, flipbooks).</li>
<li><b>Phi phenomenon</b>: lights blinking in sequence look like one moving light (marquees, light shows).</li>
<li><b>Autokinetic effect</b>: a still dot of light in a dark room seems to drift (tiny eye movements). Sherif used it to study conformity in Unit 4.</li></ul>
<p><b>Perceptual adaptation</b>: after a while with upside-down goggles, people adjust and function normally. The brain is flexible.</p>
<div class="cxs">${cx("Unit 1 · Brain plasticity (adaptation)","unit1.html")}${cx("Unit 0 · Visual cliff as an experiment","unit0.html")}${cx("Unit 1 · Nature-nurture issue","unit1.html")}</div>`},

{id:"n22",code:"2.2",t:"Thinking, Problem-Solving, Judgment & Decision-Making",h:`
<p><b>Cognition</b> covers all the mental activity of acquiring, processing, storing, and using information. <b>Metacognition</b> is thinking about your thinking, such as noticing you don't actually understand a practice question.</p>
<h3>Organizing knowledge</h3>
<ul><li><b>Concept</b>: a mental category ("fruit"). <b>Prototype</b>: the best example (an apple, not an olive). The farther an item is from the prototype, the slower we categorize it.</li>
<li><b>Schema</b>: a framework or script (a sit-down restaurant vs. a buffet vs. fast food).
<ul><li><b>Assimilation</b>: fitting new information into an existing schema (zebra = "striped horse").</li>
<li><b>Accommodation</b>: changing the schema to fit new information (a zebra is its own animal). These are Piaget's terms, coming back in Unit 3.</li></ul></li></ul>
<h3>Solving problems</h3>
<ul><li><b>Algorithm</b>: step-by-step, guarantees an answer, but can be slow (a recipe, trying every locker combination, the quadratic formula).</li>
<li><b>Heuristic</b>: a fast shortcut that is usually good but error-prone.
<ul><li><b>Representativeness</b>: judging by resemblance to a prototype, ignoring base rates ("glasses means librarian").</li>
<li><b>Availability</b>: judging by how easily examples come to mind ("plane crashes are common" right after news coverage).</li></ul></li>
<li><b>Insight</b> <span class="xtra">★</span>: the sudden "aha!"</li></ul>
<h3>How presentation shapes decisions</h3>
<ul><li><b>Priming</b>: "Say <i>folk</i> five times. What's the white of an egg?" Many people say "yolk." The answer is albumen, the egg white.</li>
<li><b>Framing</b>: a "90% success rate" surgery wins over a "10% failure rate" surgery, even though they're identical.</li></ul>
<h3>Decision fallacies</h3>
<ul><li><b>Gambler's fallacy</b>: "Tails five times, so heads is due." Each flip is independent. (Unit 0: we see patterns in random events.)</li>
<li><b>Sunk-cost fallacy</b>: staying in a bad movie because you paid. Past costs shouldn't drive future choices.</li>
<li>Also useful <span class="xtra">★</span>: <b>confirmation bias</b>, <b>overconfidence</b>, and <b>belief perseverance</b>.</li></ul>
<h3>Getting stuck</h3>
<ul><li><b>Mental set</b>: reusing an old strategy. ("6 eggs, broke 2, cooked 2, ate 2. How many left?" Answer: <b>4</b>. The eggs you broke are the ones you cooked and ate.)</li>
<li><b>Functional fixedness</b>: seeing objects only in their usual role (a book can't be a doorstop).</li></ul>
<h3>Creativity &amp; executive function</h3>
<ul><li><b>Creativity</b>: new and valuable ideas. <b>Divergent thinking</b> generates many options (uses for a paperclip). <b>Convergent thinking</b> narrows to one best answer (a riddle, a multiple-choice item). Creativity needs you to break free of mental set and functional fixedness.</li>
<li><b>Executive functions</b> (planning, prioritizing, impulse control, working memory) are run by the <b>prefrontal cortex</b> in the frontal lobe. Studying instead of gaming is executive function at work. The prefrontal cortex keeps maturing into your mid-20s.</li></ul>
<div class="tip">Representativeness asks "does it <b>look like</b> the type?" Availability asks "can I <b>think of examples</b> easily?" And don't confuse <b>mental set</b> (stuck on a <i>strategy</i>) with <b>functional fixedness</b> (stuck on an <i>object's use</i>).</div>
<div class="cxs">${cx("Unit 1 · Frontal lobes / Phineas Gage","unit1.html")}${cx("Unit 0 · Hindsight bias","unit0.html")}${cx("Unit 0 · Critical thinking","unit0.html")}${cx("2.1 · Schemas & perceptual set","#n21a")}${cx("1.6 · Priming","#n16a")}</div>`}
];

["Sensation vs. perception",[["Sensation","Receptors detect and transduce stimulus energy. Input."],["Perception","The brain organizes and interprets that input. Meaning."]],"If it's about <i>detecting</i>, it's sensation. If it's about <i>interpreting</i> or recognizing, it's perception."],
["Bottom-up vs. top-down",[["Bottom-up","Builds from raw sensory features. Data-driven."],["Top-down","Driven by expectations, schemas, and experience. Concept-driven."]],"Does prior knowledge or expectation change what's perceived? Then it's top-down."],
["Absolute vs. difference threshold",[["Absolute threshold","Can you detect it at all? (50% of the time)"],["Difference threshold (JND)","Can you tell a change between two stimuli? Follows Weber's law."]],"Detecting something from nothing is absolute. Detecting a change is JND."],

["Schema vs. perceptual set",[["Schema","A general mental framework or concept"],["Perceptual set","A readiness to perceive one thing in a given moment, produced by schemas, expectations, and emotions"]],"Perceptual set is the in-the-moment expectation. A schema is the stored knowledge behind it."],
["Assimilation vs. accommodation (schema)",[["Assimilation","New information is fit into an old schema"],["Accommodation","The schema changes to fit the new information"]],"Did the <i>schema</i> change? Then it's accommodation."],
["Algorithm vs. heuristic",[["Algorithm","Step-by-step and guaranteed, but slow"],["Heuristic","A fast shortcut that can be wrong"]],"Guaranteed answer means algorithm."],
["Representativeness vs. availability",[["Representativeness","Matches a stereotype or prototype"],["Availability","Examples come easily to mind (vivid, recent, in the news)"]],"Stereotypes point to representativeness. News and memorable events point to availability."],
["Priming vs. framing",[["Priming","An earlier stimulus activates associations"],["Framing","The wording of the same information changes the choice"]],"Same facts worded differently is framing. Something seen <i>before</i> the question is priming."],
["Gambler's vs. sunk-cost fallacy",[["Gambler's fallacy","Thinks past random outcomes change future odds"],["Sunk-cost fallacy","Sticks with something because of past investment"]],"Odds and chance point to the gambler's fallacy. Money or time already spent points to sunk cost."],
["Mental set vs. functional fixedness",[["Mental set","Stuck on an old strategy"],["Functional fixedness","Stuck on an object's usual use"]],"Is the question about an <i>object</i>? Then it's functional fixedness."],
["Divergent vs. convergent thinking",[["Divergent","Many possible answers. Brainstorming."],["Convergent","One best answer. Narrowing down."]],"Diverge = spread out. Converge = come together."],

["Activation-synthesis vs. consolidation",[["Activation-synthesis","Dreams = the brain making sense of random REM firing"],["Consolidation","Dreams and sleep = processing and storing memories"]],"\"Random\" means activation-synthesis. \"Memories\" means consolidation."],

N2:{n:"NREM-2",y:150,c:"#ffd27a",w:"Sleep spindles & K-complexes",d:"Clearly asleep and relaxing more deeply. Bursts of rapid activity (sleep spindles). Takes up about half of total sleep. Sleep talking can happen here.",f:[7,10,1]},

function wavePath(f,a,spindle){let p="";for(let x=0;x<=300;x+=2){let A=a,F=f;if(spindle&&x>120&&x<190){A=a*1.8;F=f*2.4}const y=28-A*Math.sin(2*Math.PI*F*x/300)-(A*.35)*Math.sin(2*Math.PI*F*2.7*x/300+1.3);p+=(x?"L":"M")+x+" "+y.toFixed(1)}return p}
function sleep(){
  let t=0,segs="",line="";const sx=m=>60+m*680/480;
  NIGHT.forEach(([s,m],k)=>{const x0=sx(t),x1=sx(t+m),y=SL[s].y;line+=(k?`L${x0} ${y}`:`M${x0} ${y}`)+`L${x1} ${y}`;segs+=`<rect class="seg" x="${x0}" y="${y-14}" width="${x1-x0}" height="28" fill="${SL[s].c}" fill-opacity=".18" onclick="slInfo('${s}',${t},${m})"><title>${SL[s].n} · ${m} min</title></rect>`;t+=m});
  const ylab=Object.keys(SL).map(s=>`<text x="52" y="${SL[s].y+4}" fill="${SL[s].c}" font-size="12" font-weight="700" text-anchor="end">${SL[s].n}</text>`).join("");
  const xlab=[0,1,2,3,4,5,6,7,8].map(h=>`<text x="${sx(h*60)}" y="232" fill="#9fbdf0" font-size="11" text-anchor="middle">${h}h</text><line x1="${sx(h*60)}" x2="${sx(h*60)}" y1="20" y2="210" stroke="#1f4a9c" stroke-dasharray="2 4"/>`).join("");
  $("main").innerHTML=`<div class="card"><h3 style="margin:0">A typical night of sleep</h3><div class="mu">Tap any stretch of the line. Notice two patterns: deep NREM-3 shrinks across the night, and REM periods grow. Each cycle is about 90 minutes.</div>
  <svg class="sv" viewBox="0 0 760 245" role="img" aria-label="Hypnogram of an 8 hour night">${xlab}${ylab}${segs}<path d="${line}" fill="none" stroke="#e6eeff" stroke-width="2.5" stroke-linejoin="round" pointer-events="none"/></svg>
  <div id="slI" class="wv"></div></div>
  <div class="card"><h3 style="margin:0 0 6px">Brain waves at a glance</h3><div class="mu">Fast and small means alert or REM. Slow and big means deep sleep.</div>${["W","N1","N2","N3","R"].map(s=>`<div class="wv"><b style="color:${SL[s].c}">${SL[s].n}</b> <span class="mu">· ${SL[s].w}</span><svg viewBox="0 0 300 56" preserveAspectRatio="none" style="width:100%;height:56px;display:block"><path d="${wavePath(SL[s].f[0],SL[s].f[1],SL[s].f[2])}" fill="none" stroke="${SL[s].c}" stroke-width="1.6"/></svg></div>`).join("")}</div>`;
  slInfo("N3",35,40);
}
function slInfo(s,t,m){const S=SL[s],h=x=>`${Math.floor(x/60)}h ${String(x%60).padStart(2,"0")}m`;$("slI").innerHTML=`<b style="color:${S.c};font-size:17px">${S.n}</b> <span class="mu">· ${h(t)} to ${h(t+m)} into the night (${m} min) · EEG: ${S.w}</span><div style="margin-top:6px">${S.d}</div>`}

function SPIRAL(cx,cy){let p="";for(let s=0;s<=160;s++){const t=s/160,a=Math.PI+t*2.6*2*Math.PI,r=58-52*t;p+=(s?"L":"M")+(cx+r*Math.cos(a)).toFixed(1)+" "+(cy+r*Math.sin(a)).toFixed(1)}return p}

function cFreq(v){

  const w=$("cwave"),g=$("cglow");if(!w)return;w.setAttribute("d",d);g.setAttribute("cx",x.toFixed(0));

  const ex=cf<150?"a deep bass note or thunder":cf<600?"a man's or woman's speaking voice":cf<1500?"a piano's upper middle range":cf<5000?"a baby's cry or a whistle (the ear is most sensitive here)":cf<12000?"cymbals or birdsong":"a mosquito buzz or the 'teen-only' ringtone that adults often can't hear";

}

function typ(){
  if(i>=Q.length)return done();
  const d=D[Q[i]];
  $("main").innerHTML=`<div class="mu">Term ${i+1} of ${Q.length} · Score ${sc}</div>${prog()}<div class="card"><span class="tag">${C[d[1]]}</span><div style="margin-top:8px;font-size:17px">${d[2]}</div><div class="mu" style="margin-top:6px">Hint: ${d[0].length} characters, starts with “${d[0][0]}”</div></div>
  <input type="text" id="ans" placeholder="Type the term, then press Enter" onkeydown="if(event.key==='Enter')chkT()" autocomplete="off"><div class="row"><button class="on" onclick="chkT()">Submit</button><button onclick="$('ans').value='';chkT(true)">Show answer</button></div><div id="f"></div>`;
  setTimeout(()=>$("ans")&&$("ans").focus(),30);
}
function chkT(skip){
  const k=Q[i],d=D[k],inp=norm($("ans").value);if(!skip&&!inp)return;
  const vs=variants(d[0]),exact=vs.includes(inp),close=!exact&&inp.length>5&&vs.some(v=>lev(inp,v)<=Math.max(1,Math.floor(v.length/8)));
  $("ans").disabled=true;document.querySelectorAll("#main .row button").forEach(b=>b.disabled=true);
  if(exact||close){sc++;$("f").innerHTML=`<div class="card ok">${close?"Close enough (check the spelling): ":"Correct! "}<b>${d[0]}</b></div><button class="on" onclick="i++;typ()">Next</button>`}
  else{addMiss(k);bar();$("f").innerHTML=`<div class="card bad">The term is <b>${d[0]}</b>.</div><button class="on" onclick="i++;typ()">Next</button>`}
}

function appP(b,ok){

const AAQS=[
{t:"Study 1: Sleep and Memory",s:"Researchers wanted to know whether sleep after learning improves memory. Eighty high school students (ages 15–18) from two Washington schools volunteered and gave written assent, with parental consent. All memorized 40 word pairs at 9 p.m. Students were randomly assigned either to sleep normally (8 hours) or to stay awake all night in the lab. After a recovery night, all were tested on the pairs. The sleep group recalled a mean of 31.2 pairs (SD = 4.1); the awake group recalled a mean of 22.5 pairs (SD = 5.3). The difference was statistically significant (p < .01).",
p:[["Identify the research method used in the study.","An <b>experiment</b>. The researchers manipulated sleep vs. no sleep and used random assignment."],
["State the operational definition of memory in the study.","The <b>number of the 40 word pairs correctly recalled</b> on the test after the recovery night."],
["Describe what the difference in standard deviations means.","The awake group's scores were <b>more spread out</b> around their mean (SD 5.3 vs. 4.1), so their recall was less consistent."],
["Identify at least one ethical guideline applied by the researchers.","<b>Informed consent/assent</b>: written assent from students plus parental consent for minors. (Other answers could include no lasting harm, thanks to the recovery night.)"],
["Explain the extent to which the findings may or may not be generalizable.","Limited: it used <b>volunteers aged 15–18 from two Washington schools</b>, so it may not generalize to adults or other regions. Random assignment supports a causal claim within this sample, but the sample isn't random."],
["Explain how at least one finding supports or refutes the hypothesis that sleep improves memory.","It <b>supports</b> it: the sleep group recalled significantly more pairs (31.2 vs. 22.5, p &lt; .01), which fits <b>consolidation theory</b> (1.5)."]]},
{t:"Study 2: Framing and Medical Choices",s:"A psychologist recruited 200 adults online. Participants were randomly assigned to read about a surgery described either as having a “90% survival rate” or a “10% mortality rate.” They then rated how likely they were to choose the surgery from 1 (definitely not) to 7 (definitely yes). Participants were told the study was about medical decisions and were debriefed afterward. The survival group's median rating was 6; the mortality group's median rating was 3. The effect size was large (d = 0.9).",
p:[["Identify the independent variable.","The <b>wording (frame)</b> of the surgery outcome: 90% survival vs. 10% mortality."],
["Identify the dependent variable and its operational definition.","Willingness to choose the surgery, measured as a <b>1–7 rating</b>."],
["Describe what the effect size means.","A large d (0.9) means the framing had a <b>strong, practically meaningful</b> effect on ratings, not just a statistically detectable one."],
["Identify the ethical guideline shown by the researchers.","<b>Debriefing</b>: participants were told the study's true purpose afterward (and gave informed consent)."],
["Explain how the findings support or refute the hypothesis that framing changes decisions.","They <b>support</b> it: identical information got a median of 6 when framed positively vs. 3 when framed negatively. That's the <b>framing</b> effect (2.2)."],
["Explain one limitation on generalizability.","An <b>online sample of volunteers</b> may not represent patients facing real surgery, so real stakes might change the results."]]}
